<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no">
  <title>{{ page.title }}</title>

  <!-- syntax highlighting CSS -->
  <link rel="stylesheet" href="/css/syntax.css" type="text/css" />

  <!-- Homepage CSS -->
  <link rel="stylesheet" href="/css/screen.css" type="text/css" media="screen, projection" />

  {% if page.tags contains "formula" %}
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: {
        skipTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
        inlineMath: [['$','$']]
      }
    });
  </script>
  {% endif %}
</head>
<body>

<br>
<br>
<br>

<div class="site">

  <div class="title">
    <a href="/">imekaku's blog</a>
    <a class="extra" href="/thinking">thinking</a>
    <!-- 在小屏幕的时候不显示 category tab -->
    <div id="home_tab_list">
      <a class="extra" href="/category">category</a>
    </div>
    <a class="extra" href="/life">life</a>
    <a class="extra" href="/about">about</a>
  </div>

  {{ content }}

</div>

{% if page.tags contains "formula" %}
<script>
window.onload = function() {
    var script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML';
    document.body.appendChild(script);
};
</script>
{% endif %}

<script>
(function () {
  var CONTAINER_SELECTOR = '#post';
  var EXCLUDE_SELECTOR = '#post > h1:first-of-type';

  var container = document.querySelector(CONTAINER_SELECTOR);
  if (!container) return;

  var all = container.querySelectorAll('h1, h2, h3, h4, h5, h6');
  if (!all.length) return;

  var excluded = EXCLUDE_SELECTOR
    ? new Set(container.querySelectorAll(EXCLUDE_SELECTOR))
    : new Set();

  var headings = [];
  for (var i = 0; i < all.length; i++) {
    if (!excluded.has(all[i])) headings.push(all[i]);
  }
  if (!headings.length) return;

  var startLevel = parseInt(headings[0].tagName.charAt(1), 10);
  var counters = {};
  for (var lv = startLevel; lv <= 6; lv++) counters[lv] = 0;

  headings.forEach(function (h) {
    var level = parseInt(h.tagName.charAt(1), 10);
    if (level < startLevel) return;

    counters[level]++;
    for (var d = level + 1; d <= 6; d++) counters[d] = 0;

    var parts = [];
    for (var lv2 = startLevel; lv2 <= level; lv2++) parts.push(counters[lv2]);
    var number = parts.join('.') + '.';

    var span = document.createElement('span');
    span.className = 'heading-number';
    span.textContent = number + ' ';
    h.insertBefore(span, h.firstChild);
  });
})();
</script>
<style>
.heading-number {
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
}
</style>

</body>
</html>
